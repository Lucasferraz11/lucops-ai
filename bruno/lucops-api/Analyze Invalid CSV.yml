
info:
  name: Analyze Invalid CSV
  type: http
  seq: 4

http:
  method: POST
  url: http://127.0.0.1:8000/analyses
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - ../../data/sample/transacoes_sem_cliente.csv
        contentType: text/csv; charset=utf-8
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Deve retornar status 400", function () {
            expect(res.getStatus()).to.equal(400);
        });

        test("Deve identificar a coluna ausente", function () {
            const body = res.getBody();

            expect(body.detail.includes("cliente_id")).to.equal(true);
        });


settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
