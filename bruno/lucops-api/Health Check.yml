info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:8000/health
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Deve retornar status 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Deve retornar status ok no JSON", function () {
            const body = res.getBody();

            expect(body.status).to.equal("ok");
        });

        test("Deve retornar o nome do servico", function () {
            const body = res.getBody();

            expect(body.service).to.equal("LucOps AI");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
