[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucops-ai"
version = "0.1.0"
description = "LucOps AI data quality and reliability starter package"
readme = "README.md"
requires-python = ">=3.10"


dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "httpx2",
]


[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
